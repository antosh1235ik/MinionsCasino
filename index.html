<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Minions Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* стили из предыдущей версии (опущены для краткости) */
        body { background: #0a0a12; color: #fff; font-family: system-ui, sans-serif; padding: 20px; }
        .btn { background: #f5b800; color: #000; border: none; padding: 14px 24px; border-radius: 16px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; margin: 8px 0; }
        .btn-ton { background: #0088cc; color: #fff; }
        .btn-stars { background: #ffd700; color: #000; }
        .card { background: #1a1a2e; border-radius: 20px; padding: 20px; margin: 12px 0; border: 1px solid #2a2a3e; }
        .flex { display: flex; gap: 10px; flex-wrap: wrap; }
        .text-gold { color: #f5b800; }
    </style>
</head>
<body>

<div class="card" style="text-align:center;">
    <h1>🎰 Minions Casino</h1>
    <p style="font-size:32px; font-weight:900;" id="balanceDisplay">0</p>
    <p style="color:#666;">⭐ баланс</p>
</div>

<!-- ===== ПОПОЛНЕНИЕ ЧЕРЕЗ STARS ===== -->
<div class="card">
    <h2>⭐ Пополнить через Telegram Stars</h2>
    <p style="color:#888; font-size:14px;">Комиссия 1%: 100 ⭐ → 99 ⭐ на баланс</p>
    <div class="flex">
        <button class="btn btn-stars" onclick="depositStars(50)">50 ⭐ → 49.5</button>
        <button class="btn btn-stars" onclick="depositStars(100)">100 ⭐ → 99</button>
        <button class="btn btn-stars" onclick="depositStars(250)">250 ⭐ → 247.5</button>
        <button class="btn btn-stars" onclick="depositStars(500)">500 ⭐ → 495</button>
    </div>
    <input id="customStarsAmount" type="number" placeholder="Своя сумма" style="width:100%; padding:12px; border-radius:12px; border:1px solid #333; background:#0a0a12; color:#fff; margin:8px 0;" />
    <button class="btn btn-stars" onclick="depositStars(document.getElementById('customStarsAmount').value)">⭐ Пополнить</button>
</div>

<!-- ===== ПОПОЛНЕНИЕ ЧЕРЕЗ TON ===== -->
<div class="card">
    <h2>💎 Пополнить через TON</h2>
    <p style="color:#888; font-size:14px;">Комиссия 1%: 1 TON → 0.99 ⭐ на баланс</p>
    <div class="flex">
        <button class="btn btn-ton" onclick="depositTON(1)">1 TON → 0.99</button>
        <button class="btn btn-ton" onclick="depositTON(5)">5 TON → 4.95</button>
        <button class="btn btn-ton" onclick="depositTON(10)">10 TON → 9.9</button>
    </div>
    <input id="customTONAmount" type="number" placeholder="Своя сумма" step="0.1" style="width:100%; padding:12px; border-radius:12px; border:1px solid #333; background:#0a0a12; color:#fff; margin:8px 0;" />
    <button class="btn btn-ton" onclick="depositTON(document.getElementById('customTONAmount').value)">💎 Пополнить</button>
</div>

<script>
    const API_URL = window.location.origin;
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let myId = 'user_' + Math.floor(100000 + Math.random() * 900000);
    try {
        const u = tg?.initDataUnsafe?.user;
        if (u) myId = String(u.id);
    } catch(e) {}

    async function api(endpoint, method = 'GET') {
        const res = await fetch(API_URL + endpoint, { method });
        return res.json();
    }

    async function loadBalance() {
        const data = await api(`/api/balance/${myId}`);
        document.getElementById('balanceDisplay').textContent = data.balance || 0;
    }

    // ===== STARS =====
    async function depositStars(amount) {
        if (!amount || amount < 1) { alert('Введите сумму'); return; }
        try {
            const data = await api(`/api/payment/stars/create?user_id=${myId}&amount=${parseInt(amount)}`, 'POST');
            if (data.invoice_link) {
                // Открываем ссылку для оплаты через Telegram Stars
                if (tg) {
                    tg.openTelegramLink(data.invoice_link);
                } else {
                    window.open(data.invoice_link, '_blank');
                }
                alert(`💰 Пополнение ${data.amount} ⭐ → ${data.net_amount} ⭐ на баланс (комиссия 1%)`);
            }
        } catch(e) {
            alert('Ошибка: ' + e.message);
        }
    }

    // ===== TON =====
    async function depositTON(amount) {
        if (!amount || amount < 0.1) { alert('Введите сумму (мин 0.1 TON)'); return; }
        try {
            const data = await api(`/api/payment/ton/create?user_id=${myId}&amount=${parseFloat(amount)}`, 'POST');
            if (data.wallet_address) {
                alert(`💎 Отправьте ${data.amount} TON на кошелёк:\n${data.wallet_address}\n\nПосле отправки нажмите "Подтвердить"`);
                // В реальном проекте здесь нужно добавить кнопку подтверждения
            }
        } catch(e) {
            alert('Ошибка: ' + e.message);
        }
    }

    // Для демонстрации: подтверждение TON платежа (вручную)
    async function confirmTON(paymentId) {
        const txHash = prompt('Введите хеш транзакции:');
        if (!txHash) return;
        const data = await api(`/api/payment/ton/confirm?payment_id=${paymentId}&user_id=${myId}&tx_hash=${txHash}`, 'POST');
        if (data.success) {
            alert(`✅ Пополнено ${data.net_amount} ⭐`);
            loadBalance();
        }
    }

    loadBalance();
    setInterval(loadBalance, 10000);
</script>

</body>
</html>
