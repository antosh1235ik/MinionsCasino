<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minions Casino Gifts</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-bg: #000000;
            --accent-color: #ffffff;
            --accent-glow: rgba(255, 255, 255, 0.45);
            --glass-opacity-val: 0.70;
            --glass-blur-val: 0px;
            --ios-glass-card: rgba(20, 20, 30, var(--glass-opacity-val));
            --ios-glass-border: rgba(255, 255, 255, 0.18);
            --ios-glass-specular: inset 0 1.5px 1.5px 0 rgba(255, 255, 255, 0.3);
            --btn-glass-bg: rgba(255, 255, 255, 0.22);
            --btn-glass-border: rgba(255, 255, 255, 0.28);
            --radius-pill: 9999px;
            --radius-card: 26px;
            --radius-sheet: 36px;
            --spring: cubic-bezier(0.25, 1.4, 0.35, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: var(--ios-bg);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 110px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .liquid-drop {
            position: absolute;
            border-radius: var(--radius-pill);
            filter: blur(85px);
            opacity: 0.55;
            animation: moveDrops 16s infinite alternate ease-in-out;
        }
        .drop-1 { width: 340px; height: 340px; background: radial-gradient(circle, #ff9f0a 0%, transparent 70%); top: -40px; left: -40px; }
        .drop-2 { width: 380px; height: 380px; background: radial-gradient(circle, #0a84ff 0%, transparent 70%); bottom: 100px; right: -40px; }

        @keyframes moveDrops {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(30px, 40px, 0) scale(1.1); }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 60;
            padding: 14px 18px;
            background: var(--ios-glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--ios-glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            font-size: 19px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-pill {
            background: var(--btn-glass-bg);
            padding: 7px 12px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--btn-glass-border);
            box-shadow: var(--ios-glass-specular);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .balance-pill:active { transform: scale(0.94); }

        .tabs-wrapper {
            position: sticky;
            top: 65px;
            z-index: 55;
            padding: 10px 16px;
        }
        .tabs-pill {
            display: flex;
            background: var(--ios-glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 4px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--ios-glass-border);
            gap: 4px;
        }
        .tab {
            flex: 1;
            padding: 9px 12px;
            border-radius: var(--radius-pill);
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            background: transparent;
            border: none;
            cursor: pointer;
            text-align: center;
            transition: all 0.25s var(--spring);
        }
        .tab.active {
            background: var(--btn-glass-bg);
            border: 1px solid var(--btn-glass-border);
            color: #fff;
            box-shadow: var(--ios-glass-specular);
        }

        .content {
            position: relative;
            z-index: 10;
            padding: 14px 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        .page { display: none; }
        .page.active { display: block; }

        .ios-widget {
            background: var(--ios-glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--ios-glass-border);
            border-radius: var(--radius-card);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--ios-glass-specular);
        }

        .seller-badge {
            background: rgba(255, 159, 10, 0.15);
            border: 1px solid rgba(255, 159, 10, 0.35);
            color: #ff9f0a;
            border-radius: var(--radius-pill);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 14px;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gift-card {
            background: var(--ios-glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid var(--ios-glass-border);
            box-shadow: var(--ios-glass-specular);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s var(--spring);
        }
        .gift-card:active { transform: scale(0.96); }

        .gift-image {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid var(--ios-glass-border);
        }

        .gift-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .gift-title { font-weight: 800; font-size: 13px; line-height: 1.2; }
        .gift-rarity { font-size: 10px; color: #ff9f0a; font-weight: 700; margin-top: 4px; }
        .gift-price { font-weight: 800; font-size: 14px; margin: 8px 0; color: #fff; }

        .btn, .btn-primary, .btn-outline {
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s var(--spring);
            text-align: center;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--btn-glass-bg);
            border: 1px solid var(--btn-glass-border);
            color: #ffffff;
            box-shadow: var(--ios-glass-specular);
        }
        .btn:active, .btn-primary:active { transform: scale(0.93); }
        .btn-block { width: 100%; padding: 14px; font-size: 15px; }

        .input-dark {
            background: var(--ios-glass-card);
            border: 1px solid var(--ios-glass-border);
            border-radius: var(--radius-pill);
            padding: 12px 16px;
            color: #fff;
            width: 100%;
            outline: none;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }
        .modal-box {
            background: var(--ios-glass-card);
            border-top-left-radius: var(--radius-sheet);
            border-top-right-radius: var(--radius-sheet);
            padding: 24px 20px 36px;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--ios-glass-border);
            box-shadow: 0 -20px 50px rgba(0,0,0,0.8);
        }

        .currency-switch {
            display: flex;
            background: rgba(0,0,0,0.35);
            border-radius: var(--radius-pill);
            padding: 4px;
            gap: 6px;
            margin-bottom: 14px;
        }
        .curr-btn {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-pill);
            font-weight: 700;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            text-align: center;
        }
        .curr-btn.active {
            background: var(--btn-glass-bg);
            border: 1px solid var(--btn-glass-border);
            color: #fff;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 18px;
            right: 18px;
            background: var(--ios-glass-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--ios-glass-border);
            border-radius: var(--radius-pill);
            display: flex;
            justify-content: space-around;
            padding: 8px 6px;
            z-index: 60;
        }
        .nav-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.45);
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            font-weight: 600;
            gap: 4px;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
        }
        .nav-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .nav-btn.active { color: #fff; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex { display: flex; gap: 8px; }
        .text-dim { color: rgba(255, 255, 255, 0.5); font-size: 13px; }
        .loading-shimmer { text-align: center; padding: 24px; color: rgba(255, 255, 255, 0.45); font-size: 13px; }
    </style>
</head>
<body>

<div class="ambient-canvas">
    <div class="liquid-drop drop-1"></div>
    <div class="liquid-drop drop-2"></div>
</div>

<header class="header">
    <div class="header-logo">
        <span>🎁</span> Gifts Market
    </div>
    <div class="header-right">
        <div class="balance-pill" onclick="openDeposit()">
            <span>⭐</span>
            <span id="balanceDisplay">0</span>
        </div>
        <div class="balance-pill" onclick="openDeposit()" style="color: #29b6f6;">
            <span>💎</span>
            <span id="tonBalanceDisplay">0.00</span>
        </div>
    </div>
</header>

<div class="tabs-wrapper">
    <div class="tabs-pill">
        <button class="tab active" onclick="switchPage('market')">Подарки 8133727762</button>
        <button class="tab" onclick="switchPage('profile')">Профиль и Мои Подарки</button>
    </div>
</div>

<div class="content">
    <!-- МАРКЕТ ПОДАРКОВ -->
    <div id="page-market" class="page active">
        <div class="seller-badge">
            <span>👤 Подарки Telegram пользователя:</span>
            <strong>#8133727762</strong>
        </div>
        <input class="input-dark" placeholder="🔍 Найти подарок..." id="searchInput" oninput="filterGifts()" />
        <div class="gift-grid" id="marketGrid"><div class="loading-shimmer">Подключение к Telegram Gifts...</div></div>
    </div>

    <!-- ПРОФИЛЬ И ИНВЕНТАРЬ КУПЛЕННЫХ ПОДАРКОВ -->
    <div id="page-profile" class="page">
        <div class="ios-widget">
            <div style="font-weight:800; font-size:16px; margin-bottom: 12px;">👤 Мой профиль</div>
            <div id="profileInfo" class="loading-shimmer">Загрузка...</div>
        </div>

        <div class="ios-widget">
            <div class="flex-between" style="margin-bottom:12px;">
                <div style="font-weight:800; font-size:15px;">🎁 Мои подарки в профиле</div>
                <button class="btn btn-outline" style="padding:4px 10px; font-size:11px;" onclick="loadMyGifts()">🔄</button>
            </div>
            <div class="gift-grid" id="profileGiftsGrid"><div class="loading-shimmer">Считывание инвентаря...</div></div>
        </div>

        <button class="btn btn-primary btn-block" onclick="openDeposit()">💳 Пополнить баланс (Stars / TON)</button>
    </div>
</div>

<div id="modalRoot"></div>

<div class="bottom-nav">
    <button class="nav-btn active" onclick="switchPage('market')">
        <svg viewBox="0 0 24 24"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
        <span>Подарки</span>
    </button>
    <button class="nav-btn" onclick="switchPage('profile')">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span>Профиль</span>
    </button>
</div>

<script>
    const API_URL = window.location.origin;
    const TARGET_USER = "8133727762";
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    let myId = localStorage.getItem('casino_gift_uid');
    if (!myId) {
        myId = 'user_' + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem('casino_gift_uid', myId);
    }
    try {
        if (tg?.initDataUnsafe?.user?.id) {
            myId = String(tg.initDataUnsafe.user.id);
        }
    } catch(e) {}

    let myBalance = 0;
    let myTonBalance = 0.0;
    let allMarketGifts = [];
    let myGifts = [];

    async function api(endpoint, method = 'GET', body = null) {
        const opts = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(API_URL + endpoint, opts);
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || 'Ошибка связи с сервером');
        }
        return await res.json();
    }

    async function loadAll(silent = false) {
        try {
            const user = await api(`/api/users/${myId}`);
            if (user) {
                myBalance = user.balance;
                myTonBalance = user.ton_balance;
                document.getElementById('balanceDisplay').textContent = Number(myBalance).toLocaleString();
                document.getElementById('tonBalanceDisplay').textContent = Number(myTonBalance).toFixed(2);
                renderProfileStats();
            }
            await loadMarket(silent);
            await loadMyGifts(silent);
        } catch (e) {
            console.error('Ошибка автопроверки:', e);
        }
    }

    // Загрузка подарков продавца 8133727762
    async function loadMarket(silent = false) {
        const grid = document.getElementById('marketGrid');
        if (!silent && !grid.children.length) grid.innerHTML = '<div class="loading-shimmer">Синхронизация...</div>';
        try {
            const market = await api('/api/market');
            allMarketGifts = market || [];
            renderMarket(allMarketGifts);
        } catch (e) {
            if (!silent) grid.innerHTML = '<div class="loading-shimmer">Нет активных подарков</div>';
        }
    }

    function renderMarket(items) {
        const grid = document.getElementById('marketGrid');
        if (!items || items.length === 0) {
            grid.innerHTML = `<div class="loading-shimmer" style="grid-column: span 2;">Все подарки пользователя #${TARGET_USER} раскуплены!</div>`;
            return;
        }
        grid.innerHTML = items.map(g => `
            <div class="gift-card">
                <img src="${g.image}" class="gift-image" alt="${g.name}" loading="lazy" />
                <div class="gift-info">
                    <div class="gift-title">${g.name}</div>
                    <div class="gift-rarity">${g.rarity}</div>
                    <div class="gift-price">⭐ ${g.price}</div>
                    <button class="btn btn-primary" style="width:100%;" onclick="buyGift('${g.id}')">Купить</button>
                </div>
            </div>
        `).join('');
    }

    function filterGifts() {
        const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
        const filtered = allMarketGifts.filter(g => g.name.toLowerCase().includes(q) || g.id.toLowerCase().includes(q));
        renderMarket(filtered);
    }

    // Настоящая покупка подарка
    async function buyGift(giftId) {
        try {
            const res = await api(`/api/nfts/buy?user_id=${encodeURIComponent(myId)}&nft_id=${encodeURIComponent(giftId)}`, 'POST');
            myBalance = res.new_balance;
            document.getElementById('balanceDisplay').textContent = myBalance.toLocaleString();
            alert('🎉 ' + res.message);
            await loadAll();
        } catch (e) {
            alert('❌ ' + e.message);
        }
    }

    // Загрузка подарков покупателя в профиль
    async function loadMyGifts(silent = false) {
        const grid = document.getElementById('profileGiftsGrid');
        if (!silent && !grid.children.length) grid.innerHTML = '<div class="loading-shimmer">Считывание...</div>';
        try {
            const gifts = await api(`/api/nfts/${myId}`);
            myGifts = gifts || [];
            if (myGifts.length === 0) {
                grid.innerHTML = '<div class="loading-shimmer" style="grid-column: span 2;">У вас пока нет подарков</div>';
                return;
            }
            grid.innerHTML = myGifts.map(g => `
                <div class="gift-card">
                    <img src="${g.image}" class="gift-image" alt="${g.name}" loading="lazy" />
                    <div class="gift-info">
                        <div class="gift-title">${g.name}</div>
                        <div class="gift-rarity">${g.rarity}</div>
                        <div style="margin-top:8px;">
                            <button class="btn btn-outline" style="width:100%; font-size:12px;" onclick="sellMyGift('${g.id}')">Продать</button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (e) {
            if (!silent) grid.innerHTML = '<div class="loading-shimmer">Инвентарь пуст</div>';
        }
    }

    async function sellMyGift(giftId) {
        const p = prompt('Укажите цену продажи в ⭐:', '100');
        if (!p || isNaN(p) || parseInt(p) <= 0) return;
        try {
            await api(`/api/nfts/sell?user_id=${myId}&nft_id=${giftId}&price=${parseInt(p)}`, 'POST');
            alert('✅ Подарок выставлен в маркет!');
            await loadAll();
        } catch(e) { alert('❌ ' + e.message); }
    }

    function renderProfileStats() {
        document.getElementById('profileInfo').innerHTML = `
            <div class="flex-between" style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
                <span class="text-dim">ID пользователя</span>
                <span style="font-weight:700;">${myId}</span>
            </div>
            <div class="flex-between" style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06);">
                <span class="text-dim">Баланс Stars</span>
                <span style="font-weight:800; color:#ff9f0a;">⭐ ${myBalance.toLocaleString()}</span>
            </div>
            <div class="flex-between" style="padding:6px 0;">
                <span class="text-dim">Баланс TON</span>
                <span style="font-weight:800; color:#29b6f6;">💎 ${Number(myTonBalance).toFixed(2)} TON</span>
            </div>
        `;
    }

    // Депозит Stars / TON с комиссией 1%
    let curDep = 'stars';
    function openDeposit() {
        document.getElementById('modalRoot').innerHTML = `
            <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
                <div class="modal-box">
                    <div style="font-size:18px; font-weight:800; margin-bottom:14px;">💳 Пополнение с комиссией 1%</div>
                    <div class="currency-switch">
                        <div class="curr-btn active" id="dpStars" onclick="setDep('stars')">⭐ Stars</div>
                        <div class="curr-btn" id="dpTon" onclick="setDep('ton')">💎 TON</div>
                    </div>
                    <input id="depVal" type="number" class="input-dark" value="100" oninput="calcFee()" />
                    <div style="background:rgba(0,0,0,0.3); padding:12px; border-radius:18px; margin-bottom:14px;">
                        <div class="flex-between"><span class="text-dim">Вносите:</span><span id="fPay">100 ⭐</span></div>
                        <div class="flex-between" style="margin:6px 0;"><span class="text-dim">Комиссия (1%):</span><span id="fFee" style="color:#ff453a;">1 ⭐</span></div>
                        <div class="flex-between"><span style="font-weight:800;">Получите:</span><span id="fGet" style="font-weight:900; color:#30d158;">99 ⭐</span></div>
                    </div>
                    <div class="flex">
                        <button class="btn btn-primary" style="flex:1;" onclick="doDeposit()">Пополнить</button>
                        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
                    </div>
                </div>
            </div>
        `;
        setDep('stars');
    }

    function setDep(t) {
        curDep = t;
        document.getElementById('dpStars')?.classList.toggle('active', t === 'stars');
        document.getElementById('dpTon')?.classList.toggle('active', t === 'ton');
        const input = document.getElementById('depVal');
        input.value = t === 'stars' ? '100' : '1';
        calcFee();
    }

    function calcFee() {
        const val = parseFloat(document.getElementById('depVal')?.value) || 0;
        const fee = val * 0.01;
        const get = Math.max(0, val - fee);
        const s = curDep === 'stars' ? '⭐' : 'TON';
        document.getElementById('fPay').textContent = `${val} ${s}`;
        document.getElementById('fFee').textContent = `${curDep === 'stars' ? Math.round(fee*100)/100 : fee.toFixed(4)} ${s}`;
        document.getElementById('fGet').textContent = `${curDep === 'stars' ? Math.floor(get) : Number(get.toFixed(4))} ${s}`;
    }

    async function doDeposit() {
        const val = parseFloat(document.getElementById('depVal')?.value);
        if (isNaN(val) || val <= 0) return alert('Введите корректную сумму');
        try {
            await api(`/api/balance/add?user_id=${myId}&amount=${val}&currency=${curDep}`, 'POST');
            alert('✅ Баланс успешно пополнен с учетом комиссии 1%!');
            closeModal();
            await loadAll();
        } catch(e) { alert('❌ ' + e.message); }
    }

    function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

    function switchPage(p) {
        document.querySelectorAll('.page').forEach(el => el.classList.toggle('active', el.id === 'page-' + p));
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', (p === 'market' && i === 0) || (p === 'profile' && i === 1)));
        document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', (p === 'market' && i === 0) || (p === 'profile' && i === 1)));
        if (p === 'market') loadMarket();
        if (p === 'profile') loadMyGifts();
    }

    // Старт и автопроверка каждые 5 секунд
    loadAll();
    setInterval(() => {
        loadAll(true);
    }, 5000);
</script>
</body>
</html>
